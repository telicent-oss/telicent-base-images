# Experimental UBI 10 variant; excluded from automated releases.
schema_version: 1

from: "registry.access.redhat.com/ubi10/ubi-minimal:10.3-1795002774"

name: &name "telicent-python3.14-ubi10"
version: &version "0.1.0"
description: "Telicent's base python 3.14 image built on Red Hat UBI10 minimal"

labels:
  - name: "name"
    value: *name
  - name: "version"
    value: *version
  - name: "description"
    value: "Telicent's base python 3.14 image built on Red Hat UBI10 minimal"
  - name: "com.redhat.license_terms"
    value: "https://www.redhat.com/en/about-red-hat-end-user-license-agreements#UBI" # DO NOT REMOVE
  - name: "io.k8s.display-name"
    value: "Telicent UBI Python 3.14 Base"
  - name: "io.openshift.tags"
    value: "base ubi10 telicent-python3.14-ubi10"
  - name: "org.opencontainers.image.source"
    value: "https://github.com/telicent-oss/telicent-base-images"
  - name: "summary"
    value: "Telicent Base Python 3.14 Image built from Red Hat Universal Base Image 10 with added non root default user"
  - name: "maintainer"
    value: "Telicent OSS <opensource@telicent.io>"
  - name: "vendor"
    value: "Telicent OSS"
  - name: "org.opencontainers.image.authors"
    value: "Telicent OSS <opensource@telicent.io>"
  - name: "org.opencontainers.image.vendor"
    value: "Telicent OSS"

envs:
  - name: "LANG"
    value: "en_US.UTF-8"
  - name: "LC_ALL"
    value: "en_US.UTF-8"
  - name: "PYTHONUNBUFFERED"
    value: "1"
  - name: "PYTHONIOENCODING"
    value: "UTF-8"
  - name: "PATH"
    value: "/home/user/app-venv/bin:/home/user/.local/bin:/usr/local/bin:/usr/bin:$PATH"
  - name: "PYTHON_VERSION"
    value: "3.14"
  - name: "BASH_ENV"
    value: &env "/home/user/app-venv/bin/activate"
  - name: "ENV"
    value: *env
  - name: "PROMPT_COMMAND"
    value: ". /home/user/app-venv/bin/activate"

packages:
  manager: microdnf
  manager_flags: --setopt=tsflags=nodocs --setopt=install_weak_deps=0 --enablerepo=ubi-10-appstream-rpms

modules:
  repositories:
   - path: ../modules
  install:
    - name: telicent.container.util.pkg-update
    - name: telicent.container.util.tzdata-ubi10
    - name: telicent.container.user
    - name: telicent.container.python314-microdnf
    - name: telicent.container.python-env
    - name: telicent.container.util.cleanup.microdnf
